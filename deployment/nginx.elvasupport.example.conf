# ELVA Support — Nginx reverse proxy example (Phase 13)
# TEMPLATE ONLY — adapt paths, upstreams, and certificate locations.
# Do not commit secrets or real certificate private keys.

# Expected DNS:
#   A/CNAME  admin.elvasupport.in  → this load balancer / host
#   A/CNAME  *.elvasupport.in      → this load balancer / host
#   A/CNAME  api.elvasupport.in    → this load balancer / host
#
# TLS: terminate HTTPS here (or at Cloudflare/ALB) with a certificate covering:
#   *.elvasupport.in  (and ideally elvasupport.in + admin if not covered by wildcard)

upstream elva_frontend {
    server 127.0.0.1:4200;   # or static file server / container
}

upstream elva_api {
    server 127.0.0.1:3000;
}

# Shared proxy headers — critical for tenant hostname resolution when TRUST_PROXY=1
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl http2;
    server_name admin.elvasupport.in *.elvasupport.in;

    # ssl_certificate     /etc/ssl/certs/elvasupport.fullchain.pem;
    # ssl_certificate_key /etc/ssl/private/elvasupport.key;

    # SPA + API on same portal hosts (Option A-style path split)
    location /api/ {
        proxy_pass http://elva_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
    }

    location /health {
        proxy_pass http://elva_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://elva_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
    }
}

# Dedicated API host (Option B) — frontend API_URL=https://api.elvasupport.in/api
server {
    listen 443 ssl http2;
    server_name api.elvasupport.in;

    # ssl_certificate     /etc/ssl/certs/elvasupport.fullchain.pem;
    # ssl_certificate_key /etc/ssl/private/elvasupport.key;

    location / {
        proxy_pass http://elva_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Note: tenant resolution still uses the browser Origin / portal Host
        # via CORS + frontend calling API with tenant context from portal hostname.
        # Prefer Option A (/api on tenant host) when hostname-based tenant resolution
        # must see {slug}.elvasupport.in as Host.
    }
}

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name admin.elvasupport.in *.elvasupport.in api.elvasupport.in;
    return 301 https://$host$request_uri;
}
